name: Publish create-redop-app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/create-redop-app/**"
      - ".github/workflows/publish-create-redop-app.yml"
    tags:
      - "create-redop-app-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun ci

      - name: Test and build create-redop-app
        working-directory: packages/create-redop-app
        run: |
          bun run build
          bun test
          bun run typecheck

      - name: Check whether version is already published
        id: version
        working-directory: packages/create-redop-app
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Package $NAME@$VERSION is already on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Package $NAME@$VERSION is not on npm; publishing."
          fi

      - name: Publish create-redop-app
        if: steps.version.outputs.exists != 'true'
        working-directory: packages/create-redop-app
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
